<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<title>Forge — No-Code Page Builder</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overscroll-behavior:none}
body{background:#0b0d12;color:#e8ebf2;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
:root{--tabs-h:calc(62px + env(safe-area-inset-bottom));--accent:#7c6cff;--panel:#12151d;--line:rgba(255,255,255,.08)}
#app{height:100vh;height:100dvh;display:flex;flex-direction:column;position:relative;overflow:hidden}

/* TOPBAR */
.topbar{flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:0 10px;padding-top:env(safe-area-inset-top);
  height:calc(52px + env(safe-area-inset-top));background:rgba(12,14,20,.94);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border-bottom:1px solid var(--line);z-index:60}
.brand{display:flex;align-items:center;gap:7px;font-weight:800;font-size:15px;letter-spacing:-.02em}
.brand .logo{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font-size:11px;color:#fff;
  background:linear-gradient(135deg,#7c6cff,#22d3ee);box-shadow:0 4px 14px -4px #7c6cff}
.spacer{flex:1}
.tb{height:32px;min-width:32px;padding:0 8px;border-radius:9px;border:1px solid var(--line);background:rgba(255,255,255,.04);
  color:#cfd6e6;font-size:13px;font-weight:600;display:grid;place-items:center;cursor:pointer;transition:.15s;font-family:inherit}
.tb:active{transform:scale(.93);background:rgba(255,255,255,.1)}
.tb:disabled{opacity:.28}
.tb.primary{background:linear-gradient(135deg,#7c6cff,#6a5bf0);border-color:transparent;color:#fff;box-shadow:0 6px 18px -8px #7c6cff;padding:0 12px;font-size:12px}
.devsw{display:flex;gap:2px;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:9px;padding:2px}
.devsw button{width:28px;height:26px;border:0;background:transparent;color:#8d97ad;border-radius:7px;font-size:12px;cursor:pointer;display:grid;place-items:center;transition:.15s}
.devsw button.on{background:linear-gradient(135deg,#7c6cff,#6a5bf0);color:#fff}

/* STAGE */
#stage{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;position:relative;background:#0b0d12;display:block}
#page{width:100%;min-height:100%;margin:0 auto;display:flow-root;transition:max-width .3s;background:#fff}
#canvas{max-width:100%;margin:0 auto;padding:24px 20px 100px;display:flex;flex-direction:column;gap:14px;min-height:60vh}
#canvas h1,#canvas h2,#canvas h3,#canvas h4,#canvas p,#canvas blockquote,#canvas pre{margin:0}
#canvas img{max-width:100%}

.blk{position:relative;outline:2px solid transparent;outline-offset:3px;transition:outline-color .15s;border-radius:4px}
.blk.sel{outline-color:#7c6cff}
.blk.dragging{opacity:.7;box-shadow:0 20px 50px -12px rgba(0,0,0,.6)}
.blk.enter{animation:pop .3s cubic-bezier(.34,1.4,.64,1)}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
[contenteditable]{outline:none;border-radius:4px;transition:box-shadow .15s}
[contenteditable]:focus{box-shadow:0 0 0 2px rgba(124,108,255,.6)}
#canvas.editing input,#canvas.editing textarea,#canvas.editing select,#canvas.editing button,#canvas.editing video,#canvas.editing iframe{cursor:default}

.blk-tools{position:absolute;top:-15px;right:6px;display:flex;gap:1px;z-index:30;background:#1a1e29;border:1px solid rgba(255,255,255,.12);
  border-radius:10px;padding:2px;box-shadow:0 10px 26px rgba(0,0,0,.5);animation:pop .16s ease}
.blk-tools button{width:30px;height:28px;border:0;background:transparent;color:#c9d0de;border-radius:7px;font-size:12px;display:grid;place-items:center;cursor:pointer;transition:.12s}
.blk-tools button:active{background:rgba(255,255,255,.14);transform:scale(.9)}
.blk-tools button[data-act="drag"]{cursor:grab;touch-action:none;color:#8d97ad}
.blk-tools button[data-act="del"]{color:#ff7a8a}

/* EMPTY */
.empty{padding:34px 4px;text-align:center;animation:pop .4s ease}
.empty-orb{width:76px;height:76px;margin:0 auto 18px;border-radius:24px;background:linear-gradient(135deg,#7c6cff,#22d3ee);
  box-shadow:0 24px 60px -18px #7c6cff;animation:float 4s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-8px) rotate(4deg)}}
.empty h2{font-size:21px;font-weight:800;letter-spacing:-.03em;margin:0 0 6px;color:#e8ebf2}
.empty p{font-size:13px;opacity:.6;margin:0 0 22px;color:#e8ebf2}
.tpl-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;max-width:360px;margin:0 auto}
.tpl-grid button{padding:16px 10px;border-radius:14px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.045);
  color:#dfe4ee;font-size:20px;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;transition:.15s}
.tpl-grid button span{font-size:11px;font-weight:700;opacity:.85}
.tpl-grid button:active{transform:scale(.95);background:rgba(124,108,255,.2);border-color:#7c6cff}

/* SHEET */
.sheet{position:absolute;left:0;right:0;bottom:var(--tabs-h);max-height:60vh;background:var(--panel);border-top:1px solid var(--line);
  border-radius:20px 20px 0 0;z-index:55;display:flex;flex-direction:column;transform:translateY(calc(100% + 12px));
  transition:transform .32s cubic-bezier(.32,.72,0,1);box-shadow:0 -22px 60px rgba(0,0,0,.55)}
.sheet.open{transform:translateY(0)}
.sheet-grip{flex:0 0 auto;padding:8px 0 4px;display:grid;place-items:center;cursor:pointer}
.sheet-grip i{width:36px;height:4px;border-radius:99px;background:rgba(255,255,255,.2);display:block}
.sheet-body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 14px 24px}

.ph{display:flex;align-items:center;gap:10px;padding:6px 2px 10px;position:sticky;top:0;background:var(--panel);z-index:2}
.ph-t{font-size:13px;font-weight:800;color:#dfe4ee;flex:1}
.ph-a{display:flex;gap:5px;align-items:center}
.mini{width:30px;height:28px;border-radius:8px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:#cfd6e6;
  font-size:12px;display:grid;place-items:center;cursor:pointer;font-family:inherit;transition:.15s}
.mini:active{transform:scale(.9)}
.mini.danger{color:#ff7a8a}
.tag{font-size:10px;font-weight:700;padding:4px 8px;border-radius:99px;background:rgba(124,108,255,.16);color:#a99cff}

.grp{font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#68718a;margin:12px 2px 7px}
.addgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.addgrid button{padding:13px 3px;border-radius:13px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:#cfd6e6;
  font-family:inherit;font-size:10px;font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;transition:.14s}
.addgrid button .ai{font-size:16px;line-height:1}
.addgrid button:active{transform:scale(.93);background:rgba(124,108,255,.22);border-color:#7c6cff;color:#fff}

.layers{display:flex;flex-direction:column;gap:3px;padding:2px 0 8px}
.layer{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:10px;background:rgba(255,255,255,.03);
  border:1px solid transparent;cursor:pointer;transition:.12s;font-size:12px}
.layer:hover{background:rgba(255,255,255,.07)}
.layer.sel{background:rgba(124,108,255,.18);border-color:#7c6cff}
.layer .lic{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;background:rgba(124,108,255,.18);color:#a99cff;font-size:11px;font-weight:700;flex:0 0 auto}
.layer .lbl{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;opacity:.85}
.layer .drag{cursor:grab;color:#68718a;font-size:13px;padding:0 4px;touch-action:none}
.layer.dragging{opacity:.5}

.fields{display:flex;flex-direction:column;gap:13px;padding-top:2px}
.fld label{display:block;font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#68718a;margin-bottom:6px}
.fld input[type=text],.fld textarea,.fld input:not([type]),.fld input[type=number]{width:100%;padding:10px 12px;border-radius:10px;
  border:1px solid var(--line);background:rgba(255,255,255,.05);color:#e8ebf2;font-size:13px;font-family:inherit;outline:none;transition:.15s;resize:vertical}
.fld input:focus,.fld textarea:focus{border-color:#7c6cff;background:rgba(124,108,255,.09)}
.seg{display:flex;gap:2px;background:rgba(255,255,255,.05);padding:2px;border-radius:10px;border:1px solid var(--line);flex-wrap:wrap}
.seg button{flex:1;min-width:36px;padding:7px 4px;border:0;border-radius:7px;background:transparent;color:#8d97ad;font-size:11px;font-weight:700;
  font-family:inherit;cursor:pointer;transition:.15s;text-transform:capitalize;text-overflow:ellipsis;overflow:hidden;white-space:nowrap}
.seg button.on{background:linear-gradient(135deg,#7c6cff,#6a5bf0);color:#fff;box-shadow:0 4px 12px -4px #7c6cff}
.rng{display:flex;align-items:center;gap:10px}
.rng input[type=range]{flex:1;-webkit-appearance:none;height:4px;border-radius:99px;background:rgba(255,255,255,.14);outline:none}
.rng input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.5);cursor:pointer}
.rng input[type=range]::-moz-range-thumb{width:18px;height:18px;border:0;border-radius:50%;background:#fff;cursor:pointer}
.rv{font-size:11px;font-weight:700;color:#a99cff;min-width:36px;text-align:right;font-variant-numeric:tabular-nums}
.colr{display:flex;gap:7px;align-items:center}
.colr input[type=color]{width:40px;height:36px;padding:0;border:1px solid var(--line);border-radius:9px;background:transparent;cursor:pointer}
.colr input[type=text]{flex:1}
.clr{width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:#8d97ad;font-size:14px;cursor:pointer;font-family:inherit}
.colrow{display:flex;gap:7px}
.colrow .cbox{flex:1;text-align:center}
.colrow .cbox span{display:block;font-size:9px;font-weight:700;color:#68718a;margin-top:4px;letter-spacing:.04em}
.colrow input[type=color]{width:100%;height:40px;padding:0;border:1px solid var(--line);border-radius:10px;background:transparent;cursor:pointer}
.palettes{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.palettes button{height:40px;border-radius:10px;border:1px solid var(--line);cursor:pointer;transition:.15s}
.palettes button:active{transform:scale(.92)}
.hint{padding:30px 20px;text-align:center;font-size:12px;color:#68718a;line-height:1.7}
.code{background:#0a0c11;border:1px solid var(--line);border-radius:12px;padding:12px;
  font:10.5px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3a8;max-height:36vh;overflow:auto;white-space:pre;margin:0}
.exportrow{display:flex;gap:7px;margin-bottom:11px}
.btn{flex:1;padding:12px;border-radius:11px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:#dfe4ee;
  font-size:12px;font-weight:700;font-family:inherit;cursor:pointer;transition:.15s}
.btn:active{transform:scale(.96)}
.btn.primary{background:linear-gradient(135deg,#7c6cff,#6a5bf0);border-color:transparent;color:#fff;box-shadow:0 8px 22px -10px #7c6cff}

/* TABS */
.tabs{flex:0 0 auto;height:var(--tabs-h);padding-bottom:env(safe-area-inset-bottom);display:flex;
  background:rgba(11,13,18,.97);backdrop-filter:blur(24px);border-top:1px solid var(--line);z-index:70}
.tabs button{flex:1;border:0;background:none;color:#6b7489;font-family:inherit;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:3px;font-size:9px;font-weight:700;letter-spacing:.03em;cursor:pointer;transition:.15s;padding:0}
.tabs button .ic{font-size:18px;line-height:1;transition:.2s}
.tabs button.on{color:#a99cff}
.tabs button.on .ic{transform:translateY(-2px) scale(1.12)}
.tabs button:active .ic{transform:scale(.88)}

/* EXTRAS */
#app.sheet-open #canvas{padding-bottom:calc(60vh + 40px)}
#page.mv .hm{display:none}
#page.mv .rcol{grid-template-columns:1fr!important}
#page.mv .rg2{grid-template-columns:repeat(2,1fr)!important}
.blk.hm:not(.sel){outline:1px dashed rgba(124,108,255,.55)}
.srch{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:#e8ebf2;font-size:13px;font-family:inherit;outline:none;margin-bottom:4px}
.srch:focus{border-color:#7c6cff}
.tplrow{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;-webkit-overflow-scrolling:touch}
.tplrow button{flex:0 0 auto;padding:9px 14px;border-radius:99px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:#cfd6e6;font-size:11px;font-weight:700;font-family:inherit;cursor:pointer}
.tplrow button:active{background:rgba(124,108,255,.25);border-color:#7c6cff}
.btn.up{margin-top:7px;width:100%}
.btn.warn{color:#ff7a8a}
.exportrow.wrapit{flex-wrap:wrap}
.exportrow.wrapit .btn{min-width:30%}

.ff{padding:10px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.03);display:flex;flex-direction:column;gap:7px;margin-bottom:8px}
.ffh{display:flex;gap:6px;align-items:center}
.fld .ffh input[type=text]{flex:1;min-width:0;width:auto;padding:9px 10px;font-size:13px}
.ffh select{padding:9px 8px;border-radius:9px;border:1px solid var(--line);background:#1a1e29;color:#e8ebf2;font-size:12px;font-family:inherit;text-transform:none}
.fld .ffr{display:flex;gap:8px;align-items:center;font-size:12px;font-weight:600;color:#8d97ad;text-transform:none;letter-spacing:0;margin:0}

.codeed{width:100%;font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace!important;font-size:12.5px!important;line-height:1.55;tab-size:2;white-space:pre;overflow:auto;background:#0b0d12!important;color:#d6e2ff!important;border:1px solid var(--line);border-radius:12px;padding:12px;resize:vertical;min-height:180px;margin-top:6px}
.code-status{font-size:11.5px;font-weight:600;margin-top:6px}
.code-status.ok{color:#5ee0a0}.code-status.bad{color:#ff7a8a}
#canvas .fm-back{z-index:40}#canvas .fm-drawer{z-index:41}#canvas .fm-pop{z-index:42}

.aiset{border:1px solid var(--line);border-radius:14px;padding:2px 12px 10px;margin:2px 0 12px;background:rgba(255,255,255,.03)}
.aiset summary{cursor:pointer;font-weight:800;font-size:13px;padding:11px 0;list-style:none;color:#cfd6e6}
.aiset summary::-webkit-details-marker{display:none}
.aiset .fld{margin-top:10px}
.fld input[type=password]{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:#e8ebf2;font-size:13px;font-family:inherit;outline:none}
.fld input[type=password]:focus,.fld select:focus{border-color:#7c6cff}
.fld select{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:#1a1e29;color:#e8ebf2;font-size:13px;font-family:inherit;outline:none}
.aikey{display:flex;gap:6px}.aikey input{flex:1}.aikey .clr{flex:0 0 40px}
.aicard{border:1px solid var(--line);border-radius:14px;padding:12px;margin:0 0 12px;background:rgba(255,255,255,.03)}
.aic-t{font-weight:800;font-size:14px;margin-bottom:4px;color:#e8ebf2}
.btn.pri{background:linear-gradient(135deg,#7c6cff,#6a5bf0);color:#fff;border-color:transparent;width:100%;margin-top:8px}
.btn:disabled{opacity:.55;cursor:default}
.aimsg{font-size:12px;margin-top:8px;line-height:1.5;word-break:break-word}
.aimsg.err{color:#ff7a8a}.aimsg.ok{color:#5ee0a0}.aimsg.info{color:#8d97ad}
.airow{display:flex;gap:8px;margin-top:8px}

/* TOAST */
.toast{position:fixed;left:50%;bottom:calc(var(--tabs-h) + 22px);transform:translate(-50%,20px);background:#1e2230;
  border:1px solid rgba(255,255,255,.14);color:#e8ebf2;padding:10px 18px;border-radius:99px;font-size:12px;font-weight:700;
  z-index:200;opacity:0;pointer-events:none;transition:.28s cubic-bezier(.32,.72,0,1);box-shadow:0 14px 40px rgba(0,0,0,.5)}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* PREVIEW */
#app.preview .tabs,#app.preview .sheet,#app.preview .blk-tools{display:none}
#app.preview #canvas{padding-bottom:120px}
.exitprev{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);
  padding:12px 24px;border-radius:99px;border:0;font-family:inherit;font-weight:800;font-size:12px;
  background:linear-gradient(135deg,#7c6cff,#6a5bf0);color:#fff;z-index:100;cursor:pointer;
  box-shadow:0 14px 40px -10px #7c6cff;animation:pop .3s ease}
</style>
</head>
<body>
<div id="app">

  <header class="topbar">
    <div class="brand"><span class="logo">◆</span> Forge</div>
    <div class="spacer"></div>
    <div class="devsw" id="devsw">
      <button data-w="0" class="on" title="Desktop">🖥</button>
      <button data-w="768" title="Tablet">▭</button>
      <button data-w="390" title="Mobile">📱</button>
    </div>
    <button class="tb" id="undoBtn" title="Undo">↶</button>
    <button class="tb" id="redoBtn" title="Redo">↷</button>
    <button class="tb" id="prevBtn" title="Preview">👁</button>
    <button class="tb primary" id="expBtn">Export</button>
  </header>

  <main id="stage">
    <div id="page">
      <div id="canvas"></div>
    </div>
  </main>

  <section class="sheet" id="sheet">
    <div class="sheet-grip" id="grip"><i></i></div>
    <div class="sheet-body" id="sheetBody"></div>
  </section>

  <nav class="tabs" id="tabs">
    <button data-tab="add"><span class="ic">＋</span>Add</button>
    <button data-tab="layers"><span class="ic">☰</span>Layers</button>
    <button data-tab="design"><span class="ic">✎</span>Design</button>
    <button data-tab="theme"><span class="ic">🎨</span>Theme</button>
    <button data-tab="ai"><span class="ic">✨</span>AI</button>
    <button data-tab="code"><span class="ic">⌘</span>Code</button>
  </nav>
</div>
<div class="toast" id="toast"></div>
<input type="file" id="fileIn" accept="image/*" hidden>
<input type="file" id="projIn" accept=".json,application/json" hidden>

<script>
/* ============================================================
   FORGE v3 — no-code page builder
   ============================================================ */
const $  = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const uid = ()=>Math.random().toString(36).slice(2,9);
const esc = s => String(s ?? '').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nl2br = s => String(s ?? '').replace(/\n/g,'<br>');
const num = v => (v === '' || v == null) ? '' : (/^-?\d+(\.\d+)?$/.test(v) ? v+'px' : v);
const T = () => state.theme;

const SHADOWS = [
  'none',
  '0 1px 2px rgba(0,0,0,.06),0 2px 6px rgba(0,0,0,.08)',
  '0 6px 18px -4px rgba(0,0,0,.16),0 2px 6px rgba(0,0,0,.08)',
  '0 26px 60px -18px rgba(0,0,0,.4),0 8px 20px -8px rgba(0,0,0,.2)'
];
const SHADOW_LABELS = ['None','Soft','Medium','Deep'];

const FONTS = {
  Sans:    "-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif",
  Serif:   "Georgia,'Times New Roman',Times,serif",
  Mono:    "ui-monospace,SFMono-Regular,Menlo,Consolas,monospace",
  Display: "'Trebuchet MS','Segoe UI',system-ui,sans-serif",
  Rounded: "'Verdana','Geneva',Tahoma,sans-serif",
  Inter:   "'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif",
  Poppins: "'Poppins','Segoe UI',system-ui,sans-serif",
  Outfit:  "'Outfit','Segoe UI',system-ui,sans-serif",
  Grotesk: "'Space Grotesk','Segoe UI',system-ui,sans-serif",
  Playfair:"'Playfair Display',Georgia,'Times New Roman',serif"
};
const GF = {
  Inter:'Inter:wght@400;600;700;800', Poppins:'Poppins:wght@400;600;700;800', Outfit:'Outfit:wght@400;600;700;800',
  Grotesk:'Space+Grotesk:wght@400;600;700', Playfair:'Playfair+Display:wght@400;600;700;800'
};
const fontLink = t => GF[t.font] ? `https://fonts.googleapis.com/css2?family=${GF[t.font]}&display=swap` : '';

const PRESETS = [
  { bg:'#ffffff', text:'#0f1424', accent:'#6d5efc' },
  { bg:'#0b0d12', text:'#e8ebf2', accent:'#7c6cff' },

function shade(hex, amt=-0.35){
  let h = String(hex||'#6d5efc').replace('#','');
  if(h.length===3) h = h.split('').map(c=>c+c).join('');
  const n = parseInt(h,16);
  if(isNaN(n)) return hex;
  let r=(n>>16)&255, g=(n>>8)&255, b=n&255;
  const f = v => Math.max(0,Math.min(255, Math.round(amt<0 ? v*(1+amt) : v + (255-v)*amt)));
  return `rgb(${f(r)},${f(g)},${f(b)})`;
}

function wrapCSS(w){
  w = w || {};
  const out = [];
  if(w.mt)     out.push(`margin-top:${num(w.mt)}`);
  if(w.mb)     out.push(`margin-bottom:${num(w.mb)}`);
  if(w.align)  out.push(`text-align:${w.align}`);
  if(w.bg)     out.push(`background:${w.bg}`);
  if(w.pad)    out.push(`padding:${num(w.pad)}`);
  if(w.radius) out.push(`border-radius:${num(w.radius)}`);
  if(w.border) out.push(`border:${w.border}`);
  if(w.shadow) out.push(`box-shadow:${SHADOWS[w.shadow]||w.shadow}`);
  return out.join(';');
}

function fmParse(text){
  const groups = []; let g = null;
  String(text||'').split('\n').forEach(raw=>{
    const line = raw.trim(); if(!line) return;
    if(line[0] === '#'){ g = {title: line.replace(/^#+\s*/,''), items: []}; groups.push(g); return; }
    if(!g){ g = {title:'', items:[]}; groups.push(g); }
    let p = line.split('|').map(x=>x.trim());
    const ji = p.findIndex(x=>/^js:/i.test(x));              // keep "|" inside js: code
    if(ji >= 0) p = [...p.slice(0, ji), p.slice(ji).join('|')];
    let ic='', lb, ln='#', bd='';
    if(p.length === 1) lb = p[0];
    else if(p.length === 2){ lb = p[0]; ln = p[1]; }
    else { ic = p[0]; lb = p[1]; ln = p[2]; bd = p[3] || ''; }
    g.items.push({ic, lb, ln: ln || '#', bd});
  });
  return groups;
}
function fmItem(it){
  const act = /^(js|fn):/i.test(it.ln);
  const attrs = act ? `href="#" data-fm-act="${esc(it.ln)}"`
                    : `href="${esc(it.ln)}"${/^https?:/i.test(it.ln) ? ' target="_blank" rel="noopener"' : ''}`;
  return `<a class="fm-it" ${attrs}>${it.ic ? `<span class="fm-ic">${esc(it.ic)}</span>` : ''}<span class="fm-lb">${esc(it.lb)}</span>${it.bd ? `<span class="fm-bd">${esc(it.bd)}</span>` : ''}</a>`;
}

const FM_RT = `(function(){
  if(window.forgeMenu) return;
  var ev = {};
  function emit(n,a){ (ev[n]||[]).forEach(function(f){ try{ f(a); }catch(e){ console.error(e); } }); }
  function root(r){ return r || document.querySelector('.fm'); }
  function close(){
    var any = false;
    document.querySelectorAll('.fm.open-l,.fm.open-r').forEach(function(m){ m.classList.remove('open-l','open-r'); any = true; });
    document.documentElement.style.overflow = '';
    if(any) emit('close');
  }
  function open(side, r){
    r = root(r); if(!r) return;
    var c = side === 'right' ? 'open-r' : 'open-l';
    close(); r.classList.add(c);
    if(c === 'open-l' || !r.classList.contains('pop')) document.documentElement.style.overflow = 'hidden';
    emit('open', side === 'right' ? 'right' : 'left');
  }
  function run(c){
    try{
      if(c.indexOf('fn:') === 0){
        var n = c.slice(3).replace(/\\(.*$/,'').trim();
        if(typeof window[n] === 'function') window[n]();
        else console.warn('Menu action: function "' + n + '" is not defined in your script.');
      } else if(c.indexOf('js:') === 0){ (new Function(c.slice(3)))(); }
    }catch(e){ console.error('Menu action failed:', e); }
  }
  document.addEventListener('click', function(e){
    var o = e.target.closest('[data-fm-open]');
    if(o){
      e.preventDefault();
      var m = o.closest('.fm'), s = o.getAttribute('data-fm-open'), c = s === 'right' ? 'open-r' : 'open-l';
      if(m.classList.contains(c)) close(); else open(s, m);
      return;
    }
    if(e.target.closest('[data-fm-close]')){ e.preventDefault(); close(); return; }
    var a = e.target.closest('[data-fm-act]');
    if(a){ e.preventDefault(); close(); run(a.getAttribute('data-fm-act')); return; }
    if(e.target.closest('.fm .fm-it')) close();
  });
  document.addEventListener('keydown', function(e){ if(e.key === 'Escape') close(); });
  window.forgeMenu = {
    open: function(s, r){ open(s, r); },
    close: close,
    on: function(n, f){ (ev[n] = ev[n] || []).push(f); }
  };
})();`;

form:{ label:'Form', icon:'✉', group:'Form',
  make:()=>({ props:{title:'Create your account',sub:'',button:'Create account',action:'',fields:[
      {label:'Full name',type:'text',ph:'Ada Lovelace',req:true},
      {label:'Email',type:'email',ph:'you@example.com',req:true},
      {label:'Password',type:'password',ph:'At least 8 characters',req:true},
      {label:'Confirm password',type:'password',ph:'Repeat your password',req:true}]},
    style:{fill:'',radius:12,gap:14,labels:'show',btnw:'full'} }),
  fields:[{k:'p.title',l:'Heading (empty to hide)',t:'text'},{k:'p.sub',l:'Subtext (empty to hide)',t:'text'},{t:'fields',l:'Fields'},
          {k:'p.button',l:'Button label',t:'text'},{k:'p.action',l:'Submit to URL (optional)',t:'text'},
          {k:'s.labels',l:'Field labels',t:'seg',o:['show','hide']},{k:'s.btnw',l:'Button width',t:'seg',o:['full','auto']},
          {k:'s.fill',l:'Button fill',t:'col'},{k:'s.gap',l:'Spacing',t:'rng',a:4,b:32},{k:'s.radius',l:'Corner',t:'rng',a:0,b:28}],
  inner:(p,s)=>{
    const fl = Array.isArray(p.fields) ? p.fields : [];
    const r = s.radius ?? 12, hide = s.labels === 'hide', bf = s.fill || T().accent;
    const slug = x => String(x||'field').toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'') || 'field';
    const css = `width:100%;padding:13px 16px;border-radius:${r}px;border:1px solid rgba(128,128,170,.35);background:transparent;color:inherit;font-size:15px;outline:none;font-family:inherit`;
    const fld = f=>{
      const name = slug(f.label), req = f.req ? ' required' : '', ph = esc(f.ph||''), lab = esc(f.label||'');
      if(f.type === 'checkbox') return `<label style="display:flex;gap:10px;align-items:center;font-size:14px"><input type="checkbox" name="${name}"${req} style="width:18px;height:18px;accent-color:${T().accent}"><span>${lab}</span></label>`;
      const head = hide ? '' : `<span style="display:block;font-size:13px;font-weight:600;margin-bottom:6px;opacity:.85">${lab}${f.req ? ` <span style="color:${T().accent}">*</span>` : ''}</span>`;
      const ctl = f.type === 'textarea'
        ? `<textarea name="${name}" rows="4" placeholder="${ph}"${req} style="${css};resize:vertical"></textarea>`
        : `<input type="${esc(f.type||'text')}" name="${name}" placeholder="${ph}"${req} style="${css}">`;
      return `<label style="display:block">${head}${ctl}</label>`;
    };
    const act = p.action ? `action="${esc(p.action)}" method="post"` : 'onsubmit="return false"';
    return `<form ${act} style="display:flex;flex-direction:column;gap:${s.gap??14}px;text-align:left">`
      + (p.title ? `<h3 data-prop="title" style="margin:0;font-size:22px;font-weight:800;letter-spacing:-.02em">${esc(p.title)}</h3>` : '')
      + (p.sub ? `<p data-prop="sub" style="margin:-6px 0 0;font-size:14px;opacity:.7;line-height:1.55">${esc(p.sub)}</p>` : '')
      + fl.map(fld).join('')
      + `<button type="submit" style="${s.btnw==='auto'?'align-self:flex-start;':''}padding:14px 22px;border:0;border-radius:${r}px;background:${bf};color:#fff;font-weight:700;font-size:15px;cursor:pointer;font-family:inherit;box-shadow:0 10px 24px -12px ${bf}"><span data-prop="button">${esc(p.button)}</span></button></form>`;
  } },

/* ---------- BLOCK FACTORY ---------- */
function mk(type, p={}, s={}, w={}){
  const def = BLOCKS[type];
  if(!def) throw new Error('Unknown block type: '+type);
  const base = def.make();
  return { id:uid(), type, props:{...base.props, ...p}, style:{...base.style, ...s}, wrap:{mt:0,mb:0,align:'',bg:'',pad:0,radius:0,border:'',shadow:0,hideM:'',...w} };
}

/* ---------- RENDER ---------- */
function blkStyle(b){
  const s = b.style||{}, w = b.wrap||{};
  const al = (!w.align && s.align) ? `text-align:${s.align};` : '';
  return al + wrapCSS(w);
}
function blkId(b){ const a = b.wrap && b.wrap.anchor ? String(b.wrap.anchor).replace(/[^\w-]/g,'') : ''; return a ? ` id="${a}"` : ''; }
function blkClass(b, sel){ return 'blk' + (sel?' sel':'') + (b.wrap && b.wrap.hideM ? ' hm' : ''); }

function blockHTML(b, exp=false){
  const def = BLOCKS[b.type]; if(!def) return '';
  const s = b.style||{}, w = b.wrap||{};
  const sel = !exp && b.id === selectedId && !previewMode;
  return `<div class="${blkClass(b, sel)}"${blkId(b)} data-id="${b.id}" data-type="${b.type}" style="${blkStyle(b)}">`
       + (sel ? toolbarHTML() : '')
       + def.inner(b.props||{}, s)
       + `</div>`;
}

      <button data-tpl="faq">❓<span>FAQ</span></button>
      <button data-tpl="blank">✏️<span>Blank</span></button>
    </div>
  </div>`;
}

function render(){
  canvas.innerHTML = state.blocks.length
    ? state.blocks.map(b=>blockHTML(b)).join('')
    : emptyHTML();
  applyTheme();
  canvas.classList.toggle('editing', !previewMode);
  if(previewMode) canvas.classList.remove('editing');
  $$('.blk', canvas).forEach(el=>{
    const b = state.blocks.find(x=>x.id === el.dataset.id);
    if(b) applyInline(el, b);
  });
  updateUndoBtns();
  if(typeof fmApply === 'function') fmApply();
}

function applyTheme(){
  const t = state.theme;
  const bgFull = t.bg2 ? `linear-gradient(160deg,${t.bg},${t.bg2})` : t.bg;
  page.style.background = bgFull;
  stage.style.background = deviceW ? '#0b0d12' : bgFull;
  page.classList.toggle('mv', deviceW > 0 && deviceW <= 480);
  canvas.style.gap = (t.gap ?? 14) + 'px';
  let gl = document.getElementById('forge-gf'); const gu = fontLink(t);
  if(gu){ if(!gl){ gl = document.createElement('link'); gl.id='forge-gf'; gl.rel='stylesheet'; document.head.appendChild(gl); } if(gl.href !== gu) gl.href = gu; }
  else if(gl) gl.remove();
  page.style.color = t.text;
  page.style.fontFamily = FONTS[t.font] || FONTS.Sans;
  page.style.maxWidth = deviceW ? deviceW+'px' : '100%';
  canvas.style.maxWidth = t.maxw + 'px';
  if(t.customCSS){
    let tag = document.getElementById('forge-custom');
    if(!tag){ tag = document.createElement('style'); tag.id='forge-custom'; document.head.appendChild(tag); }
    tag.textContent = t.customCSS;
  }
}

function applyInline(el, b){
  const on = inlineId === b.id && !previewMode;
  el.querySelectorAll('[data-prop]').forEach(n=>{
    if(on) n.setAttribute('contenteditable','true');
    else n.removeAttribute('contenteditable');
  });
}

function updateBlock(id){
  const b = state.blocks.find(x=>x.id === id);
  const el = canvas.querySelector(`.blk[data-id="${id}"]`);
  if(!b || !el) return;
  el.setAttribute('style', blkStyle(b));
  el.className = blkClass(b, b.id === selectedId && !previewMode);
  el.id = (b.wrap && b.wrap.anchor) ? String(b.wrap.anchor).replace(/[^\w-]/g,'') : '';
  el.innerHTML = (b.id === selectedId && !previewMode ? toolbarHTML() : '') + BLOCKS[b.type].inner(b.props, b.style);
  applyInline(el, b);
  if(fmState && fmState.id === id) fmApply();
}

/* ---------- HISTORY ---------- */
function persist(){ try{ localStorage.setItem('forge.v2', JSON.stringify(state)); }catch(e){ toast('Storage full — save a project file'); } }
function commit(){
  const s = JSON.stringify(state);
  if(hist[hi] === s) return;
  hist = hist.slice(0, hi+1);
  hist.push(s);
  if(hist.length > 80) hist.shift();
  hi = hist.length - 1;
  persist();
  updateUndoBtns();
}
function commitSoon(){ clearTimeout(commitTimer); commitTimer = setTimeout(commit, 320); }
function undo(){
  if(hi <= 0) return;
  hi--; state = JSON.parse(hist[hi]);
  selectedId = null; inlineId = null;
  render(); renderSheet(); persist(); updateUndoBtns();
}
function redo(){
  if(hi >= hist.length - 1) return;
  hi++; state = JSON.parse(hist[hi]);
  selectedId = null; inlineId = null;
  render(); renderSheet(); persist(); updateUndoBtns();
}
function updateUndoBtns(){
  $('#undoBtn').disabled = hi <= 0;
  $('#redoBtn').disabled = hi >= hist.length - 1;
}

/* ---------- SELECTION ---------- */
function select(id){
  if(selectedId === id) return;
  selectedId = id;
  if(inlineId && inlineId !== id) inlineId = null;
  render();
  if(activeTab === 'design' || activeTab === 'layers') renderSheet();
}

/* ---------- ACTIONS ---------- */
function doAction(a, blkEl){
  const id = blkEl ? blkEl.dataset.id : selectedId;
  const i = state.blocks.findIndex(b=>b.id === id);
  if(i < 0) return;
  const b = state.blocks[i];
  let structural = true;

  if(a === 'up' && i > 0){ [state.blocks[i-1], state.blocks[i]] = [state.blocks[i], state.blocks[i-1]]; }
  else if(a === 'down' && i < state.blocks.length - 1){ [state.blocks[i+1], state.blocks[i]] = [state.blocks[i], state.blocks[i+1]]; }
  else if(a === 'dup'){ const c = JSON.parse(JSON.stringify(b)); c.id = uid(); state.blocks.splice(i+1, 0, c); selectedId = c.id; }
  else if(a === 'del'){ state.blocks.splice(i, 1); if(selectedId===id) selectedId=null; if(inlineId===id) inlineId=null; }
  else if(a === 'edit'){
    inlineId = (inlineId === id) ? null : id;
    render();
    if(inlineId) focusEditable(id);
    renderSheet(); return;
  }
  else structural = false;

  if(!structural) return;
  render(); renderSheet(); commit();
}

function focusEditable(id){
  const el = canvas.querySelector(`.blk[data-id="${id}"] [contenteditable]`);
  if(!el) return;
  el.focus();
  try{
    const r = document.createRange(); r.selectNodeContents(el); r.collapse(false);
    const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
  }catch(e){}
}

function addBlock(type){
  const b = mk(type);
  const idx = state.blocks.findIndex(x=>x.id === selectedId);
  if(idx >= 0) state.blocks.splice(idx+1, 0, b);
  else state.blocks.push(b);
  selectedId = b.id;
  render();
  const el = canvas.querySelector(`.blk[data-id="${b.id}"]`);
  if(el){
    el.classList.add('enter');
    el.scrollIntoView({behavior:'smooth', block:'center'});
    setTimeout(()=>el.classList.remove('enter'), 400);
  }
  renderSheet(); commit(); toast('Block added');
}

function applyTemplate(name){
  state.blocks = (TEMPLATES[name] || TEMPLATES.blank)();
  selectedId = null; inlineId = null;
  render(); renderSheet(); commit(); toast('Template applied');
}

/* ============================================================
   AI ASSISTANT (Gemini) — script generator + title/description
   ============================================================ */
const AI_MODELS = ['gemini-3.5-flash','gemini-3.1-pro-preview','gemini-3.1-flash-lite','gemini-3-flash-preview','gemini-flash-latest'];
const AI_EXAMPLES = [
  'Make the signup form check that both passwords match',
  'Add a back-to-top button that appears after scrolling',
  'Close the header menu after tapping a link',
  'Add a dark mode toggle to the three-dots menu',
  'Show a thank-you message when the form is submitted'
];
let aiBusy = null, aiAsk = '', aiCustom = false, aiProposal = null, aiMsg = {}, aiSetOpen = null;
function aiCfg(){
  try{ const c = JSON.parse(localStorage.getItem('forge.ai') || '{}'); return {key:'', model:'gemini-3.5-flash', prompt:'', models:[], ...c}; }
  catch(e){ return {key:'', model:'gemini-3.5-flash', prompt:'', models:[]}; }
}
function aiSave(c){ try{ localStorage.setItem('forge.ai', JSON.stringify(c)); }catch(e){} }

async function geminiCall(system, user, json){
  const c = aiCfg();
  if(!c.key) throw new Error('Add your Gemini API key in Settings first.');
  const model = (c.model || 'gemini-3.5-flash').replace(/^models\//, '');
  const body = { contents:[{role:'user', parts:[{text:user}]}], generationConfig:{temperature:.3, maxOutputTokens:8192} };
  if(system) body.systemInstruction = {parts:[{text:system}]};
  if(json) body.generationConfig.responseMimeType = 'application/json';
  let r, d;
  try{
    r = await fetch('https://generativelanguage.googleapis.com/v1beta/models/' + encodeURIComponent(model) + ':generateContent',
      {method:'POST', headers:{'Content-Type':'application/json', 'x-goog-api-key': c.key}, body: JSON.stringify(body)});
    d = await r.json().catch(()=>({}));
  }catch(e){ throw new Error('Network error — check your connection and try again.'); }
  if(!r.ok){
    const m = (d.error && d.error.message) || ('Request failed (' + r.status + ')');
    throw new Error(r.status === 429 ? 'Rate limit or quota reached. ' + m : m);
  }
  const cand = d.candidates && d.candidates[0];
  const text = ((cand && cand.content && cand.content.parts) || []).map(p=>p.text || '').join('');
  if(!text) throw new Error(d.promptFeedback && d.promptFeedback.blockReason ? 'Blocked by the model: ' + d.promptFeedback.blockReason : 'The model returned no text. Try again or pick another model.');
  return text;
}
function aiParse(text){
  try{ return JSON.parse(text); }catch(e){}
  const m = String(text).match(/\{[\s\S]*\}/);
  if(m){ try{ return JSON.parse(m[0]); }catch(e){} }
  return null;
}
const aiStrip = t => String(t).replace(/^\s*```[a-z]*\n?/i, '').replace(/```\s*$/, '').trim();

/* the page the AI "sees": body markup only, no styles/scripts/inline CSS/embedded images */
function aiScan(limit){
  let h = exportHTML();
  const i = h.indexOf('<body>'), j = h.lastIndexOf('</body>');
  if(i >= 0) h = h.slice(i + 6, j >= 0 ? j : undefined);
  h = h.replace(/<script[\s\S]*?<\/script>/gi, '').replace(/<style[\s\S]*?<\/style>/gi, '')
       .replace(/<svg[\s\S]*?<\/svg>/gi, '<svg/>')
       .replace(/ style="[^"]*"/g, '')
       .replace(/data:[a-z]+\/[\w.+-]+;base64,[A-Za-z0-9+\/=]{40,}/gi, 'data:…')
       .replace(/[ \t]+/g, ' ').replace(/\n\s*\n+/g, '\n').trim();
  return h.length > limit ? h.slice(0, limit) + '\n<!-- …truncated -->' : h;
}
const aiExtra = c => c.prompt && c.prompt.trim() ? '\n\nAdditional instructions from the user (follow them):\n' + c.prompt.trim() : '';

async function aiMeta(){
  const c = aiCfg(), t = state.theme;
  const sys = 'You write SEO metadata for a web page. Work out the page\'s main purpose and topic from its content, then reply with JSON only: {"title": string, "description": string}. The title is at most 60 characters. The description is 120–160 characters, natural, specific, no hype or emoji. Use the same language as the page content. Do not invent facts that are not in the page.' + aiExtra(c);
  const usr = `Current title: ${t.title || '(none)'}\nCurrent description: ${t.desc || '(none)'}\n\nPage HTML (styles removed):\n${aiScan(30000)}`;
  const out = aiParse(await geminiCall(sys, usr, true));
  if(!out || !out.title) throw new Error('The model did not return a usable title. Try again.');
  state.theme.title = String(out.title).trim().slice(0, 90);
  state.theme.desc = String(out.description || '').trim().slice(0, 300);
  applyTheme(); commit();
  return 'Applied. You can edit the fields above, or tap Undo to revert.';
}
async function aiScript(){
  const c = aiCfg(), ask = aiAsk.trim();
  if(!ask) throw new Error('Tell the AI what the script should do first.');
  const sys = 'You are an expert front-end developer working inside a no-code page builder. You receive the page\'s HTML (styles removed, possibly truncated) and the current page script. Write plain browser JavaScript for that page: no frameworks, no imports, no network requests unless the user asks. The script runs at the end of <body>, so the DOM is ready. Target elements using the ids, classes, names and data attributes that exist in the HTML; if an element has no reliable hook, use a stable structural selector and mention in notes that the user can set an Anchor ID in that block\'s Design tab. The header-menu block can call global functions from menu links written as fn:functionName, and exposes forgeMenu.open("left"|"right"), forgeMenu.close() and forgeMenu.on("open"|"close", fn). If a current script exists, return the COMPLETE updated script that keeps the existing code unless the user asks to change it. Be defensive (null checks) and keep the code readable with short comments. Reply with JSON only: {"script": string, "notes": string} where notes is 1–3 short sentences on what it does and anything the user must set up. Never include API keys or markdown fences.' + aiExtra(c);
  const usr = `Current page script:\n${state.theme.script ? state.theme.script : '(none)'}\n\nPage HTML:\n${aiScan(60000)}\n\nRequest: ${ask}`;
  const text = await geminiCall(sys, usr, true);
  const out = aiParse(text);
  const script = out && out.script ? aiStrip(out.script) : aiStrip(text);
  if(!script) throw new Error('The model returned an empty script. Try rephrasing your request.');
  aiProposal = {script, notes: out && out.notes ? String(out.notes) : ''};
}
async function aiLoadModels(){
  const c = aiCfg();
  if(!c.key) throw new Error('Add your API key first.');
  let r, d;
  try{
    r = await fetch('https://generativelanguage.googleapis.com/v1beta/models?pageSize=200', {headers:{'x-goog-api-key': c.key}});
    d = await r.json().catch(()=>({}));
  }catch(e){ throw new Error('Network error — check your connection and try again.'); }
  if(!r.ok) throw new Error((d.error && d.error.message) || ('Request failed (' + r.status + ')'));
  const names = (d.models || []).filter(m=>(m.supportedGenerationMethods || []).includes('generateContent') && /^models\/gemini/.test(m.name))
    .map(m=>m.name.replace('models/', '')).filter(n=>!/(image|tts|live|embedding|audio|robotics|computer-use|native)/.test(n)).sort().reverse();
  if(!names.length) throw new Error('No Gemini models were returned for this key.');
  c.models = names; aiSave(c);
  return names.length + ' models loaded.';
}

async function aiRun(kind){

let fmState = null;   // {id, side} — which menu is open in the builder
function fmApply(){
  $$('.fm', canvas).forEach(m=>m.classList.remove('open-l','open-r'));
  if(!fmState) return;
  const blk = canvas.querySelector(`.blk[data-id="${fmState.id}"]`), m = blk && blk.querySelector('.fm');
  if(!m){ fmState = null; return; }
  const sr = stage.getBoundingClientRect(), pr = page.getBoundingClientRect();
  m.style.setProperty('--fm-top', sr.top + 'px');
  m.style.setProperty('--fm-bot', (innerHeight - sr.bottom) + 'px');
  m.style.setProperty('--fm-left', Math.max(pr.left, sr.left) + 'px');
  m.style.setProperty('--fm-right', (innerWidth - Math.min(pr.right, sr.right)) + 'px');

function fmEditorClick(e){
  const m = e.target.closest('.fm'); if(!m) return;
  const fo = e.target.closest('[data-fm-open]'), fc = e.target.closest('[data-fm-close]'),
        fa = e.target.closest('[data-fm-act]'), a = e.target.closest('a');

  else if(a && !previewMode && selectedId !== id) select(id);
}
stage.addEventListener('click', fmEditorClick);
document.addEventListener('keydown', e=>{ if(e.key === 'Escape' && fmState){ fmState = null; fmApply(); } });
window.addEventListener('resize', ()=>{ if(fmState) fmApply(); });

stage.addEventListener('click', e=>{
  if(previewMode) return;

  if(tpl){ applyTemplate(tpl.dataset.tpl); return; }

/* drag to reorder */
stage.addEventListener('pointerdown', e=>{
  const h = e.target.closest('[data-act="drag"]');
  if(!h) return;
  e.preventDefault();
  const el = h.closest('.blk');
  drag = { el, id: el.dataset.id };
  el.classList.add('dragging');
  window.addEventListener('pointermove', onDragMove, {passive:false});
  window.addEventListener('pointerup', endDrag);
  window.addEventListener('pointercancel', endDrag);
});

function onDragMove(e){
  if(!drag) return;
  e.preventDefault();
  const y = e.clientY;
  const others = $$('.blk', canvas).filter(n=>n !== drag.el);
  let before = null;
  for(const n of others){
    const r = n.getBoundingClientRect();
    if(y < r.top + r.height/2){ before = n; break; }
  }
  if(before){ if(drag.el.nextElementSibling !== before) canvas.insertBefore(drag.el, before); }
  else if(canvas.lastElementChild !== drag.el){ canvas.appendChild(drag.el); }
  const sr = stage.getBoundingClientRect();
  if(y < sr.top + 70) stage.scrollTop -= 16;
  else if(y > sr.bottom - 90) stage.scrollTop += 16;
}

function endDrag(){
  if(!drag) return;
  drag.el.classList.remove('dragging');
  const order = $$('.blk', canvas).map(n=>n.dataset.id);
  state.blocks.sort((a,b)=>order.indexOf(a.id) - order.indexOf(b.id));
  drag = null;
  window.removeEventListener('pointermove', onDragMove);
  window.removeEventListener('pointerup', endDrag);
  window.removeEventListener('pointercancel', endDrag);
  render(); commit(); toast('Reordered');
}

function renderSheet(){
  if(!activeTab) return;
  if(activeTab === 'add')         sheetBody.innerHTML = addPanelHTML();
  else if(activeTab === 'layers') sheetBody.innerHTML = layersPanelHTML();
  else if(activeTab === 'design') sheetBody.innerHTML = designPanelHTML();

}

let addQ = '';
function addPanelHTML(){
  const q = addQ.trim().toLowerCase();
  const groups = {};
  Object.entries(BLOCKS).forEach(([k,v])=>{
    if(q && !(v.label.toLowerCase().includes(q) || k.includes(q) || v.group.toLowerCase().includes(q))) return;
    (groups[v.group] ||= []).push([k,v]);
  });
  const tpls = !q ? `<div class="grp">Templates</div><div class="tplrow">
      <button data-tpl="landing">🚀 Landing</button><button data-tpl="profile">👤 Profile</button><button data-tpl="portfolio">🎨 Portfolio</button>
      <button data-tpl="form">✉ Contact</button><button data-tpl="pricing">$ Pricing</button><button data-tpl="event">📅 Event</button><button data-tpl="faq">❓ FAQ</button></div>` : '';
  const body = Object.keys(groups).length ? Object.entries(groups).map(([g, items])=>`
        <div class="grp">${g}</div>
        <div class="addgrid">
          ${items.map(([k,v])=>`<button data-add="${k}"><span class="ai">${v.icon}</span><span>${v.label}</span></button>`).join('')}
        </div>`).join('') : `<div class="hint">No blocks match “${esc(addQ)}”.</div>`;
  return `<div class="ph"><div class="ph-t">Add a block</div></div>
    <input class="srch" data-q placeholder="Search blocks…" value="${esc(addQ)}">` + tpls + body;
}

function fieldHTML(f, b){
  if(f.t === 'fields') return formFieldsEditor(b);
  if(f.t === 'fmprev') return fmPrevHTML();
  if(f.t === 'fmpre') return fmPreHTML(f);
  if(f.t === 'code') return codeEdHTML(f, b);
  const [sc, k] = f.k.split('.');
  const store = sc === 'p' ? b.props : (sc === 'w' ? b.wrap : b.style);
  const v = store[k];
  let inner = '';

  if(f.t === 'area'){
    inner = `<textarea data-k="${f.k}" rows="${f.rows || 3}">${esc(v ?? '')}</textarea>`;
    if(f.k === 'p.images') inner += `<button class="btn up" data-upload="${f.k}">📷 Add image from device</button>`;
  } else if(f.t === 'text'){
    const isData = typeof v === 'string' && v.startsWith('data:');
    inner = `<input type="text" data-k="${f.k}" value="${isData ? '' : esc(v ?? '')}" placeholder="${isData ? 'Uploaded image — type a URL to replace' : esc(f.l)}">`;
    if(f.k === 'p.src' && (b.type === 'image' || b.type === 'avatar')) inner += `<button class="btn up" data-upload="${f.k}">📷 Upload from device</button>`;
  } else if(f.t === 'seg'){
    const opts = f.o, labels = f.labels || opts;
    inner = `<div class="seg">${opts.map((o,i)=>
      `<button data-k="${f.k}" data-v="${esc(o)}" class="${String(v) === String(o) ? 'on' : ''}">${esc(labels[i] ?? o)}</button>`
    ).join('')}</div>`;
  } else if(f.t === 'rng'){
    inner = `<div class="rng"><input type="range" data-k="${f.k}" min="${f.a}" max="${f.b}" step="${f.st||1}" value="${v ?? f.a}"><span class="rv">${v ?? f.a}</span></div>`;
  } else if(f.t === 'col'){
    inner = `<div class="colr">
      <input type="color" data-k="${f.k}" value="${/^#/.test(v)?v:'#6d5efc'}">
      <input type="text" data-k="${f.k}" value="${esc(v || '')}" placeholder="inherit">
      <button class="clr" data-clear="${f.k}">×</button>
    </div>`;
  }
  return `<div class="fld"><label>${esc(f.l)}</label>${inner}</div>`;
}

/* ---------- SHEET EVENTS ---------- */
sheetBody.addEventListener('input', e=>{
  const el = e.target;

  /* AI settings */
  if(el.dataset && el.dataset.ai){
    const k = el.dataset.ai, c = aiCfg();
    if(k === 'ask'){ aiAsk = el.value; return; }
    if(k === 'key') c.key = el.value.trim();
    else if(k === 'prompt') c.prompt = el.value;
    else if(k === 'modelText') c.model = el.value.trim();
    else if(k === 'model'){
      if(el.value === '__custom'){ aiCustom = true; aiSave(c); renderSheet(); return; }
      aiCustom = false; c.model = el.value; aiSave(c); renderSheet(); return;
    }
    aiSave(c); return;
  }

  /* script editor: live syntax check */
  if(el.classList && el.classList.contains('codeed')){
    const st = fmCheck(el.value), box = el.parentElement.querySelector('.code-status');
    if(box){ box.textContent = st.msg; box.className = 'code-status ' + (st.ok ? 'ok' : 'bad'); }
  }

  /* form field editor */
  if(el.dataset && el.dataset.ff){
    const b = state.blocks.find(x=>x.id === selectedId); if(!b) return;
    const [i, k] = el.dataset.ff.split('.');
    const f = (b.props.fields || [])[Number(i)]; if(!f) return;
    f[k] = el.type === 'checkbox' ? el.checked : el.value;
    updateBlock(b.id); commitSoon(); return;
  }

  /* add-panel search */
  if(el.dataset && 'q' in el.dataset){
    addQ = el.value; renderSheet();
    const i = $('.srch', sheetBody); if(i){ i.focus(); i.setSelectionRange(i.value.length, i.value.length); }
    return;
  }

  /* theme inputs */
  if(el.dataset && el.dataset.tk){
    const k = el.dataset.tk;
    state.theme[k] = (el.type === 'range') ? Number(el.value) : el.value;
    if(el.type === 'range'){
      const rv = el.parentElement.querySelector('.rv');
      if(rv) rv.textContent = el.value;
    }
    applyTheme(); commitSoon();
    return;
  }

  /* block fields */
  const f = el.closest('[data-k]');
  if(!f) return;
  const b = state.blocks.find(x=>x.id === selectedId);
  if(!b) return;
  const [sc, k] = f.dataset.k.split('.');
  const store = sc === 'p' ? b.props : (sc === 'w' ? b.wrap : b.style);
  store[k] = (f.type === 'range') ? Number(f.value) : f.value;
  if(f.type === 'range'){
    const rv = f.parentElement.querySelector('.rv');
    if(rv) rv.textContent = f.value;
  }
  updateBlock(b.id);
  commitSoon();
});

sheetBody.addEventListener('click', e=>{
  const aex = e.target.closest('[data-aiex]');
  if(aex){ aiAsk = AI_EXAMPLES[Number(aex.dataset.aiex)] || ''; const ta = $('[data-ai="ask"]', sheetBody); if(ta){ ta.value = aiAsk; ta.focus(); } return; }
  const aia = e.target.closest('[data-aiact]');
  if(aia){
    const a = aia.dataset.aiact;
    if(a === 'showkey'){ const i = $('[data-ai="key"]', sheetBody); if(i) i.type = i.type === 'password' ? 'text' : 'password'; }
    else if(a === 'meta' || a === 'script' || a === 'models') aiRun(a);
    else if(a === 'discard'){ aiProposal = null; aiMsg.script = null; renderSheet(); }
    else if(a === 'apply' && aiProposal){
      state.theme.script = aiProposal.script; aiProposal = null; aiMsg.script = {t:'ok', m:'Applied to the page script. Tap Undo to revert.'};
      commit(); renderSheet(); toast('Script applied');
    }
    return;
  }
  const fp = e.target.closest('[data-fmprev]');
  if(fp){
    const side = fp.dataset.fmprev;
    fmState = (side === 'close' || !selectedId) ? null : {id: selectedId, side};
    fmApply(); return;
  }
  const fpre = e.target.closest('[data-fmpre]');
  if(fpre){
    const b = state.blocks.find(x=>x.id === selectedId); if(!b) return;
    const [side, name] = fpre.dataset.fmpre.split(':');
    b.props[side] = fmPreText(side, name);
    updateBlock(b.id); renderSheet(); commit(); toast(name + ' menu loaded'); return;
  }
  const sn = e.target.closest('[data-snip]');
  if(sn){
    const b = state.blocks.find(x=>x.id === selectedId); if(!b) return;
    const code = FM_SNIPS[sn.dataset.snip]; if(!code) return;
    b.props.script = (b.props.script ? b.props.script.replace(/\s+$/,'') + '\n\n' : '') + code + '\n';
    updateBlock(b.id); renderSheet(); commit();
    const ta = $('.codeed', sheetBody); if(ta){ ta.scrollTop = ta.scrollHeight; }
    return;
  }

  const fa = e.target.closest('[data-fa]');
  if(fa){
    const b = state.blocks.find(x=>x.id === selectedId); if(!b) return;
    const arr = b.props.fields || (b.props.fields = []);
    const [op, ix] = fa.dataset.fa.split(':'), i = Number(ix);
    if(op === 'add') arr.push({label:'New field', type:'text', ph:'', req:false});
    else if(op === 'del') arr.splice(i, 1);
    else if(op === 'up' && i > 0) [arr[i-1], arr[i]] = [arr[i], arr[i-1]];
    else if(op === 'down' && i < arr.length-1) [arr[i+1], arr[i]] = [arr[i], arr[i+1]];
    updateBlock(b.id); renderSheet(); commit(); return;
  }

  const add = e.target.closest('[data-add]');
  if(add){ addBlock(add.dataset.add); return; }

  const tpl = e.target.closest('[data-tpl]');
  if(tpl){
    if(state.blocks.length && !confirm('Replace the current page with this template? You can undo afterwards.')) return;
    applyTemplate(tpl.dataset.tpl); return;
  }

  const up = e.target.closest('[data-upload]');
  if(up){ uploadKey = up.dataset.upload; $('#fileIn').click(); return; }

  const tkc = e.target.closest('[data-tkclear]');
  if(tkc){ state.theme[tkc.dataset.tkclear] = ''; applyTheme(); renderSheet(); commit(); return; }

  const mini = e.target.closest('[data-sheet]');
  if(mini){ doAction(mini.dataset.sheet, null); return; }

  /* layers: tap to select, drag grip to reorder */
  const grip = e.target.closest('[data-lgrip]');
  if(grip){
    const b = state.blocks.find(x=>x.id === grip.dataset.lgrip);
    if(!b) return;
    e.preventDefault();
    let target = null;
    const onMove = ev=>{
      const el = document.elementFromPoint(ev.clientX, ev.clientY);
      const layer = el && el.closest('[data-lid]');
      document.querySelectorAll('.layer').forEach(l=>l.classList.remove('dragging'));
      if(layer && layer.dataset.lid !== b.id){ layer.classList.add('dragging'); target = layer.dataset.lid; }
    };
    const onUp = ()=>{
      window.removeEventListener('pointermove', onMove);
      window.removeEventListener('pointerup', onUp);
      if(target){
        const i = state.blocks.findIndex(x=>x.id === b.id);
        const j = state.blocks.findIndex(x=>x.id === target);
        state.blocks.splice(i,1);
        state.blocks.splice(j,0,b);
        render(); renderSheet(); commit(); toast('Reordered');
      } else {
        document.querySelectorAll('.layer').forEach(l=>l.classList.remove('dragging'));
      }
    };
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
    return;
  }

  const layer = e.target.closest('[data-lid]');
  if(layer){ select(layer.dataset.lid); return; }

  const seg = e.target.closest('.seg button[data-v]');
  if(seg){
    const b = state.blocks.find(x=>x.id === selectedId); if(!b) return;
    const [sc, k] = seg.dataset.k.split('.');
    const store = sc === 'p' ? b.props : (sc === 'w' ? b.wrap : b.style);
    const raw = seg.dataset.v;
    store[k] = isNaN(raw) || raw === '' ? raw : Number(raw);
    updateBlock(b.id); renderSheet(); commit(); return;
  }

  const clr = e.target.closest('[data-clear]');
  if(clr){
    const b = state.blocks.find(x=>x.id === selectedId); if(!b) return;
    const [sc, k] = clr.dataset.clear.split('.');
    const store = sc === 'p' ? b.props : (sc === 'w' ? b.wrap : b.style);
    store[k] = '';
    updateBlock(b.id); renderSheet(); commit(); return;
  }

  const font = e.target.closest('[data-font]');
  if(font){ state.theme.font = font.dataset.font; applyTheme(); renderSheet(); commit(); return; }

  const pre = e.target.closest('[data-preset]');
  if(pre){
    const p = PRESETS[Number(pre.dataset.preset)];
    state.theme.bg = p.bg; state.theme.text = p.text; state.theme.accent = p.accent;
    applyTheme(); renderSheet(); commit(); toast('Palette applied'); return;
  }

  const x = e.target.closest('[data-x]');
  if(x){
    const a = x.dataset.x;
    if(a === 'copy') copyHTML();
    else if(a === 'dl') downloadHTML();
    else if(a === 'tab') openInTab();
    else if(a === 'save') saveProject();
    else if(a === 'open') $('#projIn').click();
    else if(a === 'new'){
      if(confirm('Clear the whole page and start from scratch? You can undo afterwards.')){
        state.blocks = []; selectedId = null; inlineId = null; render(); renderSheet(); commit(); toast('Page cleared');
      }
    }
  }
});

/* ---------- EXPORT ---------- */
function exportHTML(){
  const t = state.theme;
  const font = FONTS[t.font] || FONTS.Sans;
  const body = state.blocks.map(b=>blockHTML(b, true)).join('\n');
  const gu = fontLink(t);
  const fontTag = gu ? `<link rel="preconnect" href="https://fonts.googleapis.com">\n<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n<link rel="stylesheet" href="${gu}">\n` : '';
  const descTag = t.desc ? `<meta name="description" content="${esc(t.desc)}">\n` : '';
  const iconTag = t.icon ? `<link rel="icon" href="data:image/svg+xml,${encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>${t.icon}</text></svg>`)}">\n` : '';
  const bgFull = t.bg2 ? `linear-gradient(160deg,${t.bg},${t.bg2})` : t.bg;
  const navs = state.blocks.filter(b=>b.type === 'navmenu');
  const fmCss = navs.length ? FM_CSS + 'html{scroll-behavior:smooth}\n' + navs.filter(b=>(b.style||{}).sticky !== 'off').map(b=>`.blk[data-id="${b.id}"]{position:sticky;top:0;z-index:40}`).join('') : '';
  const fmJs = navs.length ? `<script>\n${FM_RT}\n<\/script>\n` + navs.map(b=>String(b.props.script||'').trim()).filter(Boolean)
      .map(sc=>`<script>\n${sc.replace(/<\/script/gi, '<\\/script')}\n<\/script>`).join('\n') + '\n' : '';
  const pgJs = String(t.script||'').trim() ? `<script>\n${String(t.script).replace(/<\/script/gi, '<\\/script')}\n<\/script>\n` : '';
  return `<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>${esc(t.title || 'My Page')}</title>
${descTag}${iconTag}${fontTag}<style>
  *{box-sizing:border-box}
  html{background:${t.bg}}
  html,body{margin:0}
  body{
    min-height:100vh;
    background:${bgFull};
    color:${t.text};
    font-family:${font};
    -webkit-font-smoothing:antialiased;
    line-height:1.5;
  }
  .wrap{
    max-width:${t.maxw}px;
    margin:0 auto;
    padding:28px 20px 80px;
    display:flex;
    flex-direction:column;
    gap:${t.gap ?? 14}px;
  }
  h1,h2,h3,h4,p,blockquote,pre,figure{margin:0}
  img{max-width:100%;display:block}
  a{color:inherit}
  input,button,textarea,select{font-family:inherit}
  input:focus,button:focus,textarea:focus,select:focus{outline:2px solid ${t.accent};outline-offset:2px}
  ${fmCss}
  ${t.customCSS || ''}
  @media (max-width:600px){
    .wrap{padding:20px 16px 60px}
    .hm{display:none!important}
    .rcol{grid-template-columns:1fr!important}
    .rg2{grid-template-columns:repeat(2,1fr)!important}
  }
</style>
</head>
<body>
<div class="wrap">
${body}
</div>
${fmJs}${pgJs}</body>
</html>`;
}

function copyHTML(){
  const html = exportHTML();
  const done = ()=>toast('HTML copied');
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(html).then(done).catch(()=>fallbackCopy(html, done));
  } else fallbackCopy(html, done);
}
function fallbackCopy(text, cb){
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); cb(); }catch(e){ toast('Copy failed'); }
  document.body.removeChild(ta);
}
function downloadHTML(){
  const blob = new Blob([exportHTML()], {type:'text/html'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (state.theme.title || 'page').toLowerCase().replace(/[^a-z0-9]+/g,'-') + '.html';
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  toast('Downloading…');
}

/* ---------- TOAST ---------- */
let toastTimer;
function toast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>toastEl.classList.remove('show'), 1700);
}

/* ---------- TOP BAR ---------- */
$('#undoBtn').addEventListener('click', undo);
$('#redoBtn').addEventListener('click', redo);
$('#expBtn').addEventListener('click', ()=>{
  if(previewMode) exitPreview();
  openSheet('code');
});
$('#prevBtn').addEventListener('click', ()=>{ previewMode ? exitPreview() : enterPreview(); });

$$('#devsw button').forEach(b=>b.addEventListener('click', ()=>{
  $$('#devsw button').forEach(x=>x.classList.toggle('on', x===b));
  deviceW = Number(b.dataset.w) || 0;
  applyTheme();
  setTimeout(()=>{ render(); }, 50);
}));

function enterPreview(){
  previewMode = true;
  selectedId = null; inlineId = null;
  document.getElementById('app').classList.add('preview');
  sheet.classList.remove('open'); activeTab = null; updateTabs();
  render();
  const btn = document.createElement('button');
  btn.className = 'exitprev'; btn.id = 'exitPrev'; btn.textContent = 'Done previewing';
  btn.onclick = exitPreview;
  document.body.appendChild(btn);
  stage.scrollTop = 0;
  toast('Preview mode — tap Done when finished');
}
function exitPreview(){
  previewMode = false;
  document.getElementById('app').classList.remove('preview');
  const b = document.getElementById('exitPrev'); if(b) b.remove();
  render();
}

/* ---------- KEYBOARD ---------- */
document.addEventListener('keydown', e=>{
  const mod = e.metaKey || e.ctrlKey;
  if(mod && e.key.toLowerCase() === 'z'){ e.preventDefault(); e.shiftKey ? redo() : undo(); }
  if(e.key === 'Escape'){
    if(previewMode) exitPreview();
    else if(sheet.classList.contains('open')){ sheet.classList.remove('open'); activeTab=null; updateTabs(); }
    else select(null);
  }
});

/* ---------- PROJECT FILES, UPLOADS, EXTRAS ---------- */
let uploadKey = null;
function openInTab(){
  const url = URL.createObjectURL(new Blob([exportHTML()], {type:'text/html'}));
  const w = window.open(url, '_blank');
  if(!w) toast('Pop-up blocked — allow pop-ups to preview');
  setTimeout(()=>URL.revokeObjectURL(url), 60000);
}
function saveProject(){
  const blob = new Blob([JSON.stringify(state)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (state.theme.title || 'page').toLowerCase().replace(/[^a-z0-9]+/g,'-') + '.forge.json';
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  toast('Project saved');
}
function normalizeState(){
  const t = state.theme;
  t.customCSS ??= ''; t.script ??= ''; t.gap ??= 14; t.bg2 ??= ''; t.desc ??= ''; t.icon ??= ''; t.maxw ??= 720; t.title ??= 'My Page'; t.font ??= 'Sans';
  state.blocks = state.blocks.filter(b=>b && BLOCKS[b.type]);
  state.blocks.forEach(b=>{ b.props ||= {}; b.style ||= {}; b.wrap ||= {}; b.id ||= uid(); if(b.wrap.hideM === undefined) b.wrap.hideM = '';
    if(b.type === 'form' && !Array.isArray(b.props.fields)){
      b.props.fields = [{label:'Email', type:'email', ph:b.props.placeholder || 'you@example.com', req:true}];
      b.props.title ??= ''; b.props.sub ??= ''; b.props.action ??= ''; b.props.button ||= 'Subscribe';
      b.style.gap ??= 14; b.style.labels ??= 'hide'; b.style.btnw ??= 'full';
    }
  });
}
$('#projIn').addEventListener('change', e=>{
  const f = e.target.files[0]; e.target.value = ''; if(!f) return;
  const rd = new FileReader();
  rd.onload = ()=>{
    try{
      const d = JSON.parse(rd.result);
      if(!d || !Array.isArray(d.blocks) || !d.theme) throw new Error('bad');
      state = d; normalizeState(); selectedId = null; inlineId = null;
      render(); renderSheet(); commit(); toast('Project opened');
    }catch(err){ toast('Not a valid project file'); }
  };
  rd.readAsText(f);
});
$('#fileIn').addEventListener('change', e=>{
  const f = e.target.files[0]; e.target.value = '';
  const b = state.blocks.find(x=>x.id === selectedId);
  if(!f || !uploadKey || !b) return;
  const key = uploadKey.split('.')[1];
  const rd = new FileReader();
  rd.onload = ()=>{
    const done = url=>{
      b.props[key] = key === 'images' ? ((b.props[key] ? String(b.props[key]).trim() + '\n' : '') + url) : url;
      updateBlock(b.id); renderSheet(); commit(); toast('Image added');
    };
    if(/gif|svg/.test(f.type)) return done(rd.result);
    const im = new Image();
    im.onload = ()=>{
      const sc = Math.min(1, 1400 / Math.max(im.width, im.height));
      const c = document.createElement('canvas');
      c.width = Math.round(im.width * sc); c.height = Math.round(im.height * sc);
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      done(c.toDataURL(f.type === 'image/png' ? 'image/png' : 'image/jpeg', .85));
    };
    im.onerror = ()=>toast('Could not read that image');
    im.src = rd.result;
  };
  rd.readAsDataURL(f);
});

canvas.addEventListener('submit', e=>{
  e.preventDefault();
  toast(previewMode ? 'Form submitted (preview only)' : 'Forms submit on the exported page');
});

/* double-click any text to edit it in place */
stage.addEventListener('dblclick', e=>{
  if(previewMode) return;
  const blk = e.target.closest('.blk');
  if(!blk || !blk.querySelector('[data-prop]')) return;
  const id = blk.dataset.id;
  selectedId = id; inlineId = id;
  render(); focusEditable(id); renderSheet();
});

/* block clipboard + shortcuts */
let clip = null;
const typing = t => t && (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName));
document.addEventListener('keydown', e=>{
  if(typing(e.target) || previewMode) return;
  const mod = e.metaKey || e.ctrlKey, k = e.key.toLowerCase();
  if(mod && k === 'y'){ e.preventDefault(); redo(); return; }
  if(!selectedId) return;
  if(k === 'delete' || k === 'backspace'){ e.preventDefault(); doAction('del', null); }
  else if(mod && k === 'd'){ e.preventDefault(); doAction('dup', null); }
  else if(e.altKey && k === 'arrowup'){ e.preventDefault(); doAction('up', null); }
  else if(e.altKey && k === 'arrowdown'){ e.preventDefault(); doAction('down', null); }
  else if(mod && k === 'c' && !String(window.getSelection()).length){
    const b = state.blocks.find(x=>x.id === selectedId);
    if(b){ clip = JSON.stringify(b); toast('Block copied'); }
  }
});
document.addEventListener('keydown', e=>{
  if(typing(e.target) || previewMode) return;
  if((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'v' && clip){
    e.preventDefault();
    const c = JSON.parse(clip); c.id = uid();
    const i = state.blocks.findIndex(x=>x.id === selectedId);
    state.blocks.splice(i >= 0 ? i+1 : state.blocks.length, 0, c);
    selectedId = c.id; render(); renderSheet(); commit(); toast('Block pasted');
  }
});

sheetBody.addEventListener('toggle', e=>{ if(e.target.classList && e.target.classList.contains('aiset')) aiSetOpen = e.target.open; }, true);
sheetBody.addEventListener('keydown', e=>{
  if(e.key === 'Tab' && e.target.classList && e.target.classList.contains('codeed')){
    e.preventDefault();
    const t = e.target, a = t.selectionStart, z = t.selectionEnd;
    t.value = t.value.slice(0, a) + '  ' + t.value.slice(z);
    t.selectionStart = t.selectionEnd = a + 2;
    t.dispatchEvent(new Event('input', {bubbles:true}));
  }
});
document.head.insertAdjacentHTML('beforeend', '<style id="fm-css">' + FM_CSS + '</style>');

/* ---------- INIT ---------- */
function defaultState(){
  return {
    theme:{ title:'My Page', font:'Sans', bg:'#ffffff', text:'#0f1424', accent:'#6d5efc', maxw:720, customCSS:'', gap:14, bg2:'', desc:'', icon:'', script:'' },
    blocks: TEMPLATES.landing()
  };
}

function init(){
  let loaded = null;
  try{ const raw = localStorage.getItem('forge.v2'); if(raw) loaded = JSON.parse(raw); }catch(e){}
  state = (loaded && loaded.blocks && loaded.theme) ? loaded : defaultState();
  normalizeState();
  hist = []; hi = -1;
  render(); commit(); updateUndoBtns(); updateTabs();
}

init();
</script>
</body>
</html>
